<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregando...</title>
  <link rel="stylesheet" href="catalogo.css">
</head>
<body>
  <header id="topo">
    <div class="container">
      <img id="logo" src="" alt="Logo" style="display:none">
      <h1 id="loja-nome">Carregando...</h1>
    </div>
  </header>

  <main class="container">
    <section id="buscador">
      <input type="text" id="busca" placeholder="Buscar produtos..." oninput="filtrar()">
    </section>

    <nav id="categorias"></nav>

    <section id="watermark" style="display:none">
      <p>Catálogo gratuito · AquaCatálogo</p>
    </section>

    <section id="produtos"></section>
  </main>

  <div id="modal-detalhes" class="modal" style="display:none" onclick="fecharDetalhes(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="fecharDetalhes()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <div class="container">
      <div style="text-align:center;margin-bottom:8px">
        <span id="theme-toggle" onclick="toggleTheme()" style="display:inline-block;padding:8px 16px;border-radius:8px;border:1px solid var(--border,#ddd);background:var(--bg-card,#fff);color:var(--text,#333);font-size:14px;cursor:pointer;user-select:none">🌙 Tema escuro</span>
      </div>
      <div id="social-links"></div>
      <a id="whatsapp-btn" href="#" target="_blank" class="btn-whatsapp">
        Fale conosco pelo WhatsApp
      </a>
    </div>
  </footer>

  <script src="catalogo.js"></script>
</body>
</html>
