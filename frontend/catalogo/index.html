<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Confira nossos produtos!">
  <meta property="og:title" content="Carregando...">
  <meta property="og:description" content="Confira nossos produtos!">
  <meta property="og:type" content="website">
  <title>Carregando...</title>
  <link rel="stylesheet" href="catalogo.css">
</head>
<body>
  <header id="topo">
    <div class="container">
      <img id="logo" src="" alt="Logo" style="display:none">
      <h1 id="loja-nome">Carregando...</h1>
    </div>
  </header>

  <section id="hero-banner">
    <div class="container">
      <h2 id="hero-titulo">Bem-vindo à nossa loja!</h2>
      <p id="hero-descricao">Confira nossos produtos e faça seu pedido pelo WhatsApp.</p>
    </div>
  </section>

  <main class="container">
    <section id="buscador">
      <input type="text" id="busca" placeholder="Buscar produtos..." autocomplete="off">
      <button id="search-clear" aria-label="Limpar busca">&times;</button>
    </section>

    <nav id="categorias"></nav>

    <section id="watermark" style="display:none">
      <p>Catálogo gratuito · AquaCatálogo</p>
    </section>

    <section id="destaques"></section>

    <section id="produtos"></section>
  </main>

  <div id="modal-detalhes" class="modal" style="display:none" onclick="fecharDetalhes(event)" role="dialog" aria-modal="true" aria-label="Detalhes do produto">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="fecharDetalhes()" aria-label="Fechar">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="footer-main">
        <span id="theme-toggle" class="footer-btn" onclick="toggleTheme()" role="button" tabindex="0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          Tema escuro
        </span>
        <div id="social-links"></div>
        <a id="whatsapp-btn" href="#" target="_blank" class="footer-btn footer-btn-whatsapp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Fale conosco
        </a>
      </div>
      <div class="footer-copy" id="footer-copy"></div>
    </div>
  </footer>

  <script src="catalogo.js"></script>
</body>
</html>
