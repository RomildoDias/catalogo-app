version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo_pass
      POSTGRES_DB: catalogo_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://catalogo:catalogo_pass@db:5432/catalogo_app
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
      SUPERADMIN_EMAIL: admin@catalogo.app
      SUPERADMIN_PASSWORD: admin123
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend-painel:
    build: ./frontend/painel
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/painel:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
